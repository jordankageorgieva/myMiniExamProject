{% extends 'base.html' %}
{% block content %}
    <section class="editPage">
        <form method="post">
            <fieldset>
                <legend>Delete Category</legend>
                <div class="container">
                    <p>Are you sure you want to delete category: <strong>{{ category.name }}</strong>?</p>

                    {% csrf_token %}

                    <!-- Button for Deleting an Album -->
                    <button class="delete-album" type="submit">Delete Category</button>
                </div>
            </fieldset>
        </form>
    </section>

{% endblock %}
