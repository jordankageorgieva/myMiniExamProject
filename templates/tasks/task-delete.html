{% extends 'base.html' %}
{% block content %}
    <section class="editPage">
        <form method="post">
            <fieldset>
                <legend>Delete Task</legend>
                <div class="container">
                    <p>Are you sure you want to delete task: <strong>{{ task.title }}</strong>?</p>
                    {% csrf_token %}

                    <!-- Button for Deleting an Album -->
                    <button class="delete-album" type="submit">Delete Task</button>
                </div>
            </fieldset>
        </form>
    </section>

{% endblock %}
